<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Axiom by Zyvor — Multi-cluster Kubernetes console" />
        <!-- UI text is the system SF Pro stack; JetBrains Mono is a self-hosted mono fallback (src/index.js). -->
        <script>
            /* pre-paint theme (keep in sync with src/lib/theme.js) */
            (function () {
                var t = "dark";
                try {
                    var s = localStorage.getItem("axiom-theme") || localStorage.getItem("kubecloud.theme");
                    if (s === "light") t = "light";
                    else if (s === "system" && window.matchMedia && !window.matchMedia("(prefers-color-scheme: dark)").matches) t = "light";
                } catch (e) {}
                var r = document.documentElement;
                r.dataset.theme = t;
                if (t === "dark") r.classList.add("dark");
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute("content", t === "light" ? "#f5f5f7" : "#000000");
            })();
        </script>
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>Axiom by Zyvor — Multi-cluster Console</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

    -->
    </body>
</html>
