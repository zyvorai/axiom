name: Release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AXIOM_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/zyvorai/axiom:${{ steps.version.outputs.version }}
            ghcr.io/zyvorai/axiom:latest

      # Visible, not yet a merge/release gate — see SECURITY.md.
      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/zyvorai/axiom:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
