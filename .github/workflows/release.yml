name: Release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless signing (Sigstore/Fulcio via GitHub OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AXIOM_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/zyvorai/axiom:${{ steps.version.outputs.version }}
            ghcr.io/zyvorai/axiom:latest

      # Visible, not yet a merge/release gate — see SECURITY.md.
      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/zyvorai/axiom:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL,HIGH

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signing via Sigstore/Fulcio, using this workflow's own
      # GitHub OIDC token as identity — no private key to generate,
      # store, or rotate. Verify with:
      #   cosign verify ghcr.io/zyvorai/axiom:<version> \
      #     --certificate-identity-regexp 'https://github.com/zyvorai/axiom/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign published image
        run: cosign sign --yes "ghcr.io/zyvorai/axiom@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/zyvorai/axiom:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: axiom-${{ steps.version.outputs.version }}.sbom.spdx.json
          upload-artifact: true
