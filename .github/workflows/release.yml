name: Release binaries

# Binary-only releases: no container image is published. Pushing a v* tag
# builds the Kubernetes-enabled binary for each platform and attaches the
# archives plus SHA256SUMS to a GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and embed the UI
        run: ./scripts/sync-ui.sh

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="zyvor-axiom_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${NAME}"
          go build -modfile=go.production.mod -tags kubernetes -trimpath \
            -ldflags="-s -w -X github.com/zyvorai/axiom/internal/api.buildVersion=${VERSION#v}" \
            -o "dist/${NAME}/zyvor-axiom" ./cmd/zyvor-axiom
          cp README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Zyvor Axiom ${GITHUB_REF_NAME}" \
            --generate-notes
