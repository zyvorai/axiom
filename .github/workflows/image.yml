name: Container image

# Publishes ghcr.io/zyvorai/axiom for a release tag. Runs on every v* tag, or
# manually for an existing tag: Actions -> Container image -> Run workflow, tag=v0.2.1.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.2.1)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  image:
    needs: verify
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: v
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zyvorai/axiom
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          labels: |
            org.opencontainers.image.source=https://github.com/zyvorai/axiom
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            AXIOM_VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: cosign sign --yes "ghcr.io/zyvorai/axiom@${{ steps.build.outputs.digest }}"
