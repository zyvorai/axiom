# Default values for the Axiom Helm chart.
# See docs/QUICKSTART.md for a walkthrough of a first install.

namespace: axiom-system
# Create the namespace as part of the release. Set to false if it already
# exists (e.g. you used `helm install -n axiom-system --create-namespace`).
createNamespace: true

image:
  repository: ghcr.io/zyvorai/axiom
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 1

# For HA set replicaCount: 2 (or more) AND auth.sessionSecret to a stable
# random value so OIDC/SAML sessions validate on every replica.

# Sets AXIOM_CLUSTER_NAME (the label shown in the sidebar cluster switcher
# and Settings -> Clusters). Defaults to "in-cluster" if left blank.
clusterName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Local operator credentials, seeded into Secret zyvor-axiom-auth.
# CHANGE THESE before installing anywhere but a throwaway evaluation
# cluster — see docs/QUICKSTART.md and docs/DEPLOYMENT.md#production-hardening-checklist.
auth:
  username: demo
  password: demo
  # Signs OIDC/SAML session cookies/tokens. REQUIRED when replicaCount > 1
  # so sessions validate on every replica. Generate with:
  #   openssl rand -base64 32
  sessionSecret: ""
  # Audit ring retention (default 5000). Maps to AXIOM_AUDIT_RING_SIZE.
  auditRingSize: 5000
  # Set to a header name (e.g. "X-Forwarded-For") ONLY if Axiom sits behind
  # a reverse proxy that itself sets/overwrites that header — otherwise
  # leave blank. Enables the login rate limiter to key on the real client
  # IP instead of the proxy's, so one user's failed logins can't lock out
  # everyone else behind the same proxy.
  trustedProxyHeader: ""
  # SAML (optional). ACS is always /api/v1/auth/saml/acs on this Service.
  samlLoginURL: ""
  samlEntityID: ""
  samlAllowUnsigned: false
  # LDAP (optional). When enabled, Basic-auth form binds against ldapURL.
  ldapEnabled: false
  ldapURL: ""
  ldapDomain: ""
  ldapBaseDN: ""
  # Group-based role mapping (optional, only takes effect with ldapBaseDN set —
  # see docs/GAPS.md). ldapGroupAttr defaults to memberOf when either group is set.
  ldapGroupAttr: ""
  ldapAdminGroup: ""
  ldapViewerGroup: ""
  # OIDC default role when admin/viewer groups are unset (admin|viewer|operator).
  oidcDefaultRole: admin

tls:
  # If set, the chart uses this pre-existing TLS Secret (type: kubernetes.io/tls)
  # instead of generating one — the right choice for a CA-issued certificate.
  existingSecret: ""
  # Only used when existingSecret is empty: the chart generates and reuses a
  # self-signed cert across upgrades (same shape as scripts/deploy-remote.sh's
  # lab flow). Fine for evaluation; replace with existingSecret in production.
  selfSigned:
    enabled: true
    hosts:
      - axiom.local

# How the Service is exposed. One of: ClusterIP, NodePort, Ingress.
expose:
  type: NodePort
  nodePort: 30590
  ingress:
    className: ""
    host: ""
    annotations: {}

# Optional OIDC wiring (can also be configured later via Settings -> Integrations).
oidc:
  issuer: ""
  loginURL: ""
  clientID: ""
  groupsClaim: ""
  adminGroup: ""
  viewerGroup: ""

# Optional Atlas storage control-plane wiring (can also be configured later
# via Settings -> Integrations).
atlas:
  url: ""
  consoleURL: ""

# RBAC scope. The default ClusterRole matches deploy/k8s/rbac.yaml exactly.
# Set to false only if you're supplying your own narrower Role/RoleBinding
# per docs/DEPLOYMENT.md's least-privilege guidance.
rbac:
  create: true
