apiVersion: v1
kind: Secret
metadata:
  name: zyvor-axiom-auth
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  {{- if .Values.auth.sessionSecret }}
  sessionSecret: {{ .Values.auth.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.auth.totpSecret }}
  totpSecret: {{ .Values.auth.totpSecret | quote }}
  {{- end }}
  {{- if (.Values.cost | default dict).prometheusToken }}
  prometheusToken: {{ .Values.cost.prometheusToken | quote }}
  {{- end }}
