apiVersion: v1
kind: Secret
metadata:
  name: zyvor-axiom-auth
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ .Values.auth.password | quote }}
  {{- if .Values.auth.sessionSecret }}
  sessionSecret: {{ .Values.auth.sessionSecret | quote }}
  {{- end }}
