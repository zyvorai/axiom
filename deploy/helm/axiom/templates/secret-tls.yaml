{{- if and (not .Values.tls.existingSecret) .Values.tls.selfSigned.enabled }}
{{- $secretName := "zyvor-axiom-tls" }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- if $existing }}
# Reuse the cert generated on a previous install/upgrade instead of rotating
# it every time — same behavior as scripts/deploy-remote.sh's .run/tls cache.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert (first .Values.tls.selfSigned.hosts) nil .Values.tls.selfSigned.hosts 3650 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
