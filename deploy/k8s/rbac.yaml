apiVersion: v1
kind: ServiceAccount
metadata:
  name: zyvor-axiom
  namespace: axiom-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zyvor-axiom
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "events", "nodes", "namespaces", "endpoints", "persistentvolumeclaims", "persistentvolumes", "secrets", "configmaps", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The Eviction API needs its own rule on the pods/eviction subresource —
  # a real gap found by testing the Pods page's evict action end-to-end
  # against a real cluster: it was always missing, so evict has silently
  # 500'd in every production deploy until now.
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # No "create": Axiom's Launch wizard doesn't create DaemonSets, only
  # lists/restarts/deletes ones already installed by the platform team.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  # Read-only: Helm needs this to apply/verify a Deployment's owned
  # ReplicaSets during `helm install` (confirmed against a real cluster —
  # installs fail without it, even with --wait removed).
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinerestores", "virtualmachinesnapshotcontents"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["clone.kubevirt.io"]
    resources: ["virtualmachineclones"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["export.kubevirt.io"]
    resources: ["virtualmachineexports"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["velero.io"]
    resources: ["restores", "backupstoragelocations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["velero.io"]
    resources: ["schedules"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch", "update", "patch", "create", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/vnc", "virtualmachineinstances/console"]
    verbs: ["get"]
  # ClusterRole/ClusterRoleBinding stay read-only deliberately — write access
  # to Role/RoleBinding is granted below, but a UI path to create
  # cluster-scoped roles would be a materially bigger privilege-escalation
  # surface than a namespace-scoped one.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "alertmanagers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["platform.example.com"]
    resources: ["agentruns", "intents"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["platform.example.com"]
    resources: ["agentruns/status", "intents/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["identity.haven.dev"]
    resources: ["identityplanes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.keycloak.org"]
    resources: ["keycloaks"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["axiom.zyvor.dev"]
    resources: ["axiomplugins"]
    verbs: ["get", "list", "watch"]
  # Security views (RBAC viewer, NetworkPolicy analysis, /security). Read-only:
  # ServiceAccounts for the RBAC viewer's subject list; scanner output from
  # Trivy Operator and wgpolicyk8s.io PolicyReports (Kyverno / Gatekeeper
  # compatible). The CRDs are optional — without them /security shows an
  # install hint. roles/rolebindings/clusterroles/clusterrolebindings are
  # already readable above.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports", "configauditreports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zyvor-axiom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zyvor-axiom
subjects:
  - kind: ServiceAccount
    name: zyvor-axiom
    namespace: axiom-system
