# NodePort for lab HTTPS access. Port is patched by scripts/deploy-remote.sh (default 30590).
apiVersion: v1
kind: Service
metadata:
  name: zyvor-axiom-nodeport
  namespace: axiom-system
  labels:
    app: zyvor-axiom
spec:
  type: NodePort
  selector:
    app: zyvor-axiom
  ports:
    - name: https
      port: 443
      targetPort: https
      nodePort: 30590
