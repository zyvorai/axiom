# Example: expose Axiom through Setura (Gateway API).
# Prefer this over Ingress NGINX (retiring). Requires Setura installed
# and its GatewayClass (default name: setura) with controller
# zyvor.dev/setura-gateway, plus the standard Gateway API CRDs.
#
# Install Setura (once per cluster; needs the `setura` CLI):
#   setura gateway install --image ghcr.io/zyvorai/zyvor-setura-gateway:0.7.0 \
#     --namespace setura-system | kubectl apply -f -
#
# Then apply (edit hostname + certificate Secret first):
#   kubectl apply -f deploy/k8s/setura-gateway-example.yaml
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zyvor-axiom
  namespace: axiom-system
  labels:
    app.kubernetes.io/name: zyvor-axiom
    app.kubernetes.io/part-of: axiom
spec:
  gatewayClassName: setura
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: axiom.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: zyvor-axiom-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zyvor-axiom
  namespace: axiom-system
  labels:
    app.kubernetes.io/name: zyvor-axiom
    app.kubernetes.io/part-of: axiom
spec:
  parentRefs:
    - name: zyvor-axiom
      kind: Gateway
  hostnames:
    - axiom.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zyvor-axiom
          port: 443
