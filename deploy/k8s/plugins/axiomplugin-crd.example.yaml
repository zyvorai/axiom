# Tier 1 plugin extension point for Axiom (see docs/ARCHITECTURE.md).
#
# An AxiomPlugin is pure data: it tells Axiom's UI which existing CRD to
# render (as a table + detail view) and which of a small whitelisted
# action set to expose. It never carries or executes code, and it cannot
# grant itself any RBAC beyond what its target CRD's group already has in
# deploy/k8s/rbac.yaml.
#
# This is an opt-in extension point, not part of the base install: apply
# it manually if you want to try Tier 1 plugins. It is not referenced by
# scripts/deploy-remote.sh.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: axiomplugins.axiom.zyvor.dev
spec:
  group: axiom.zyvor.dev
  scope: Cluster
  names:
    plural: axiomplugins
    singular: axiomplugin
    kind: AxiomPlugin
    listKind: AxiomPluginList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["displayName", "target"]
              properties:
                displayName:
                  type: string
                icon:
                  type: string
                target:
                  type: object
                  required: ["group", "version", "kind", "plural", "scope"]
                  properties:
                    group:
                      type: string
                    version:
                      type: string
                    kind:
                      type: string
                    plural:
                      type: string
                    scope:
                      type: string
                      enum: ["Namespaced", "Cluster"]
                columns:
                  type: array
                  items:
                    type: object
                    required: ["path", "label", "type"]
                    properties:
                      path:
                        type: string
                      label:
                        type: string
                      type:
                        type: string
                        enum: ["name", "string", "badge", "status", "age", "count"]
                actions:
                  type: array
                  items:
                    type: object
                    required: ["name", "type"]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: ["delete"]
      additionalPrinterColumns:
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Target Kind
          type: string
          jsonPath: .spec.target.kind
---
# Example: renders the cluster's VolumeSnapshots as a plugin nav entry.
# Requires no new target-CRD RBAC — snapshot.storage.k8s.io already has
# full CRUD granted in deploy/k8s/rbac.yaml, so the delete action here
# can be exercised end-to-end without touching that file.
apiVersion: axiom.zyvor.dev/v1alpha1
kind: AxiomPlugin
metadata:
  name: volume-snapshots-viewer
spec:
  displayName: Volume Snapshots
  icon: Snowflake
  target:
    group: snapshot.storage.k8s.io
    version: v1
    kind: VolumeSnapshot
    plural: volumesnapshots
    scope: Namespaced
  columns:
    - path: name
      label: Name
      type: name
    - path: namespace
      label: Namespace
      type: string
    - path: age
      label: Age
      type: age
  actions:
    - name: delete
      type: delete
